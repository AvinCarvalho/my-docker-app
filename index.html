<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Taskly</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: white;
      min-height: 100vh;
    }
    /* HEADER */
    header {
      background: linear-gradient(90deg, #e94560, #0f3460);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    header h1 { font-size: 28px; letter-spacing: 2px; }
    header span { background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; font-size: 14px; }

    /* STATS */
    .stats {
      display: flex;
      gap: 20px;
      padding: 30px 40px;
      background: #16213e;
    }
    .stat-card {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .stat-card .number { font-size: 42px; font-weight: bold; color: #e94560; }
    .stat-card .label { color: #a8dadc; font-size: 14px; margin-top: 5px; }

    /* MAIN */
    .main { display: flex; gap: 30px; padding: 30px 40px; }

    /* ADD TASK */
    .add-section {
      width: 350px;
      background: #16213e;
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      height: fit-content;
    }
    .add-section h2 { margin-bottom: 20px; color: #a8dadc; }
    .add-section input, .add-section select, .add-section textarea {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 14px;
      margin-bottom: 15px;
      outline: none;
    }
    .add-section textarea { height: 80px; resize: none; }
    .priority-btns { display: flex; gap: 10px; margin-bottom: 15px; }
    .priority-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 12px;
      transition: 0.3s;
    }
    .priority-btn.low.active { background: #2ecc71; border-color: #2ecc71; }
    .priority-btn.medium.active { background: #f39c12; border-color: #f39c12; }
    .priority-btn.high.active { background: #e74c3c; border-color: #e74c3c; }
    .add-btn {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #e94560, #0f3460);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }
    .add-btn:hover { opacity: 0.9; transform: scale(1.02); }

    /* TASK LIST */
    .task-section { flex: 1; }
    .filters { display: flex; gap: 10px; margin-bottom: 20px; }
    .filter-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    .filter-btn.active { background: #e94560; border-color: #e94560; }
    .task-card {
      background: #16213e;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 15px;
      transition: 0.3s;
    }
    .task-card:hover { border-color: #e94560; transform: translateX(5px); }
    .task-card.done { opacity: 0.5; }
    .task-card.done .task-title { text-decoration: line-through; }
    .checkbox {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid #e94560;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: 0.3s;
    }
    .checkbox.checked { background: #e94560; }
    .task-info { flex: 1; }
    .task-title { font-size: 16px; margin-bottom: 5px; }
    .task-desc { font-size: 12px; color: rgba(255,255,255,0.4); }
    .task-meta { display: flex; gap: 10px; margin-top: 8px; }
    .priority-tag {
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
    }
    .priority-tag.low { background: rgba(46,204,113,0.2); color: #2ecc71; }
    .priority-tag.medium { background: rgba(243,156,18,0.2); color: #f39c12; }
    .priority-tag.high { background: rgba(231,76,60,0.2); color: #e74c3c; }
    .delete-btn {
      background: transparent;
      border: 1px solid rgba(231,76,60,0.3);
      color: #e74c3c;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .delete-btn:hover { background: #e74c3c; color: white; }
    .empty-state { text-align: center; padding: 60px; color: rgba(255,255,255,0.2); }
    .empty-state .icon { font-size: 60px; margin-bottom: 20px; }
    .search-bar {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #16213e;
      color: white;
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
    }
  </style>
</head>
<body>

<header>
  <h1>✅ Taskly</h1>
  <span>🚀 Microservices Architecture</span>
</header>

<div class="stats">
  <div class="stat-card">
    <div class="number" id="total-count">0</div>
    <div class="label">Total Tasks</div>
  </div>
  <div class="stat-card">
    <div class="number" id="pending-count" style="color:#f39c12">0</div>
    <div class="label">Pending</div>
  </div>
  <div class="stat-card">
    <div class="number" id="done-count" style="color:#2ecc71">0</div>
    <div class="label">Completed</div>
  </div>
  <div class="stat-card">
    <div class="number" id="high-count" style="color:#e74c3c">0</div>
    <div class="label">High Priority</div>
  </div>
</div>

<div class="main">
  <!-- ADD TASK -->
  <div class="add-section">
    <h2>➕ Add New Task</h2>
    <input type="text" id="task-title" placeholder="Task title...">
    <textarea id="task-desc" placeholder="Description (optional)..."></textarea>
    <div style="color:#a8dadc; font-size:13px; margin-bottom:10px;">Priority:</div>
    <div class="priority-btns">
      <button class="priority-btn low" onclick="setPriority('low')">🟢 Low</button>
      <button class="priority-btn medium active" onclick="setPriority('medium')">🟡 Medium</button>
      <button class="priority-btn high" onclick="setPriority('high')">🔴 High</button>
    </div>
    <button class="add-btn" onclick="addTodo()">+ Add Task</button>
  </div>

  <!-- TASK LIST -->
  <div class="task-section">
    <input class="search-bar" type="text" placeholder="🔍 Search tasks..." oninput="filterTasks(this.value)">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
      <button class="filter-btn" onclick="setFilter('done', this)">Completed</button>
      <button class="filter-btn" onclick="setFilter('high', this)">🔴 High Priority</button>
    </div>
    <div id="todo-list"></div>
  </div>
</div>

<script>
  const API = "http://15.207.247.58:8000"
  let allTodos = []
  let currentPriority = 'medium'
  let currentFilter = 'all'
  let searchQuery = ''

  function setPriority(p) {
    currentPriority = p
    document.querySelectorAll('.priority-btn').forEach(b => b.classList.remove('active'))
    document.querySelector(`.priority-btn.${p}`).classList.add('active')
  }

  function setFilter(f, btn) {
    currentFilter = f
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    renderTodos()
  }

  function filterTasks(q) {
    searchQuery = q.toLowerCase()
    renderTodos()
  }

  async function loadTodos() {
    const res = await fetch(`${API}/todos`)
    allTodos = await res.json()
    updateStats()
    renderTodos()
  }

  function updateStats() {
    document.getElementById('total-count').textContent = allTodos.length
    document.getElementById('pending-count').textContent = allTodos.filter(t => !t.done).length
    document.getElementById('done-count').textContent = allTodos.filter(t => t.done).length
    document.getElementById('high-count').textContent = allTodos.filter(t => t.priority === 'high').length
  }

  function renderTodos() {
    const list = document.getElementById('todo-list')
    let filtered = allTodos

    if(currentFilter === 'pending') filtered = filtered.filter(t => !t.done)
    if(currentFilter === 'done') filtered = filtered.filter(t => t.done)
    if(currentFilter === 'high') filtered = filtered.filter(t => t.priority === 'high')
    if(searchQuery) filtered = filtered.filter(t => t.task.toLowerCase().includes(searchQuery))

    if(filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>No tasks found!</p></div>`
      return
    }

    list.innerHTML = filtered.map(todo => `
      <div class="task-card ${todo.done ? 'done' : ''}">
        <div class="checkbox ${todo.done ? 'checked' : ''}" onclick="toggleTodo('${todo._id}', ${todo.done})">
          ${todo.done ? '✓' : ''}
        </div>
        <div class="task-info">
          <div class="task-title">${todo.task}</div>
          ${todo.description ? `<div class="task-desc">${todo.description}</div>` : ''}
          <div class="task-meta">
            <span class="priority-tag ${todo.priority || 'medium'}">${todo.priority || 'medium'}</span>
          </div>
        </div>
        <button class="delete-btn" onclick="deleteTodo('${todo._id}')">🗑️ Delete</button>
      </div>
    `).join('')
  }

  async function addTodo() {
    const title = document.getElementById('task-title').value
    const desc = document.getElementById('task-desc').value
    if(!title) return alert('Please enter a task title!')
    await fetch(`${API}/todos`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({task: title, description: desc, done: false, priority: currentPriority})
    })
    document.getElementById('task-title').value = ''
    document.getElementById('task-desc').value = ''
    loadTodos()
  }

  async function deleteTodo(id) {
    await fetch(`${API}/todos/${id}`, { method: "DELETE" })
    loadTodos()
  }

  async function toggleTodo(id, done) {
    await fetch(`${API}/todos/${id}`, {
      method: "PATCH",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({done: !done})
    })
    loadTodos()
  }

  loadTodos()
</script>
</body>
</html>
